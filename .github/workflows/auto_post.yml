name: Facebook Auto Post
on:
  schedule:
    - cron: '0 * * * *'  # Har 1 ghante baad chalega
  workflow_dispatch:      # Manual test karne ke liye

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install axios
      - run: node post.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
