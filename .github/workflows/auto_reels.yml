name: 【entity-Facebook¦canonical_name=Facebook】 Auto Post (Reels)

on:
  schedule:
    # Har 2 ghante baad :30 par - 12:30, 2:30, 4:30, 6:30, 8:30, 10:30
    # UTC time hai, Pakistan time se 5 ghante peeche hai
    - cron: '30 7,9,11,13,15,17,19,21,23,1,3,5 * * *'
  workflow_dispatch:

jobs:
  post_reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install Python Packages
        run: |
          pip install requests Pillow

      - name: Run Reels Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: |
          python reels.py
