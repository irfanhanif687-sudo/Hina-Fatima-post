name: Facebook Auto Post (Premium Shayari)

on:
  schedule:
    - cron: '*/35 * * * *'  # Backup ke liye
  workflow_dispatch:        # Main trigger (cron-job.org se)

permissions:
  contents: write # Zaroori hai taake script used_images.txt update kar sake

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Run Auto Post Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: python post.py

      - name: Commit used images state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add used_images.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update used images [skip ci]"
          git push
