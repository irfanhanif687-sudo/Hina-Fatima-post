name: Facebook Auto Post
on:
  schedule:
    - cron: '0 * * * *'  # Har 1 ghante baad chalega
  workflow_dispatch:      # Manual test ke liye

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Axios
        run: npm install axios

      - name: Run Auto Post Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: node post.js
