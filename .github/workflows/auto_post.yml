name: Facebook Auto Post (Urdu Shayari)

on:
  schedule:
    - cron: '*/35 * * * *'  # ✅ Har 35 minute baad post hogi
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Libraries for Urdu
        run: |
          sudo apt-get update
          # ✅ Yeh libraries Urdu text ko sahi se jodne aur render karne ke liye zaroori hain
          sudo apt-get install -y libfribidi0 libraqm-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow arabic-reshaper python-bidi

      - name: Run Auto Post Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: python post.py
