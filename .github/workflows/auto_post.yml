name: Facebook Auto Post (Urdu Shayari)

on:
  schedule:
    - cron: '*/35 * * * *'  # ✅ Har 35 minute baad post hogi
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Fonts (Urdu Support)
        run: |
          sudo apt-get update
          # ✅ Sahi package ka naam fonts-noto-core hai
          sudo apt-get install -y fonts-noto-core
          
          # ✅ Backup Plan: Agar system font na mile toh direct download karein
          mkdir -p ~/.fonts
          wget -q -O ~/.fonts/NotoNastaliqUrdu-Regular.ttf "https://github.com/notofonts/nastaliq/releases/download/NotoNastaliqUrdu-v3.009/NotoNastaliqUrdu-Regular.ttf" || true
          fc-cache -f -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow arabic-reshaper python-bidi

      - name: Run Auto Post Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: python post.py
