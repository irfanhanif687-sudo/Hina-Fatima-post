name: Reel Only Test
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests Pillow
      - run: python post.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          POST_TYPE: reel
      - name: Save used files
        run: |
          git config user.name "AutoBot"
          git config user.email "bot@bot.com"
          rm -f post.jpg reel.mp4 Poppins-Bold.ttf
          git add used.json used_reels.json
          git commit -m "update used" || echo "no change"
          git pull --rebase --autostash
          git push
