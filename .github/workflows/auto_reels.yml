name: Facebook Auto Post (Reels)

on:
  schedule:
    - cron: '30 * * * *'  # Har ghante ke 30 minute par - 1:30, 2:30, 3:30
  workflow_dispatch:

jobs:
  post_reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Reels Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: python reels.py
