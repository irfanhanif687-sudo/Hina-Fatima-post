name: Facebook Auto Post (Reels)

on:
  schedule:
    # ✅ CHECKED - Har 2 Hours baad, 30 min par
    # 12:30, 2:30, 4:30, 6:30, 8:30, 10:30...
    - cron: '30 */2 * * *'
  workflow_dispatch:

jobs:
  post_reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install FFmpeg Auto
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run Reels Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: python reels.py
